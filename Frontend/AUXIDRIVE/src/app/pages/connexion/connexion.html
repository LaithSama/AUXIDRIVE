<header class="entete">
  <nav class="container d-flex align-items-center justify-content-between py-3">
    <a routerLink="/" class="marque">
      <img class="marque-logo" src="img/logo-auxiassur.jpg" alt="" />
      Auxiassur
    </a>
    <div class="d-flex align-items-center gap-2">
      <a routerLink="/inscription" class="btn-contour">Créer un compte</a>
      <img class="entete-drapeau" src="img/drapeau-droite.jpg" alt="" aria-hidden="true" />
    </div>
  </nav>
</header>

<main class="page-auth connexion-main">
  <div class="carte connexion-carte">
    <h1 class="connexion-titre">Espace Client</h1>
    <p class="chapeau connexion-chapeau">Connectez-vous pour accéder à votre espace assurance.</p>

    <form (ngSubmit)="onSubmit()">
      <!-- Champ Email -->
      <div class="champ">
        <label for="email">Adresse e-mail</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="exemple@email.com"
          [(ngModel)]="email"
          required
        />
      </div>

      <!-- Champ Mot de passe -->
      <div class="champ">
        <label for="password">Mot de passe</label>
        <input
          type="password"
          id="password"
          name="motDePasse"
          placeholder="••••••••"
          [(ngModel)]="motDePasse"
          required
        />
      </div>

      <!-- Affichage dynamique du message d'erreur backend -->
      @if (errorMessage) {
        <div class="message-erreur text-center" role="alert">
          {{ errorMessage }}
        </div>
      }

      <!-- Bouton de soumission -->
      <button type="submit" class="btn-signal connexion-envoi">
        Se connecter
      </button>
    </form>

    <p class="connexion-pied-texte">
      Pas encore inscrit ?
      <a routerLink="/inscription" class="lien-discret">Faire une demande</a>
    </p>
  </div>
</main>

<footer class="pied">
  <div class="container d-flex justify-content-between flex-wrap gap-2">
    <span>Auxiassur — Assurance automobile</span>
    <span>Tous droits réservés</span>
  </div>
</footer>
