<header class="entete dashboard-entete">
  <div class="container d-flex align-items-center justify-content-between py-3">
    <a routerLink="/dashboard" class="marque"><img class="marque-logo" src="img/logo-auximad.png" alt="" />Auxiassur <span class="marque-suffixe">Espace</span></a>
  </div>
</header>

<div class="container-fluid">
  <div class="row">
    <!-- Barre latérale de navigation (Sidebar) -->
    <nav id="sidebarMenu" class="col-md-3 col-lg-2 d-md-block sidebar py-4">
      <ul class="nav flex-column gap-1">
        <li class="nav-item">
          <a class="nav-link sidebar-lien" routerLink="/dashboard"
             routerLinkActive="sidebar-lien-actif" [routerLinkActiveOptions]="{exact: true}">
            <i class="bi bi-speedometer2 me-2" aria-hidden="true"></i>Tableau de bord
          </a>
        </li>

        <!-- Liens visibles uniquement pour les clients -->
        @if (userRole === 'ROLE_CLIENT' || userRole === 'CLIENT') {
          <li class="nav-item">
            <a class="nav-link sidebar-lien" routerLink="/dashboard/vehicules" routerLinkActive="sidebar-lien-actif">
              <i class="bi bi-car-front-fill me-2" aria-hidden="true"></i>Mes véhicules
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link sidebar-lien" routerLink="/dashboard/contrats" routerLinkActive="sidebar-lien-actif">
              <i class="bi bi-file-earmark-check-fill me-2" aria-hidden="true"></i>Mes contrats
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link sidebar-lien" routerLink="/dashboard/sinistres" routerLinkActive="sidebar-lien-actif">
              <i class="bi bi-exclamation-triangle-fill me-2" aria-hidden="true"></i>Déclarer un sinistre
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link sidebar-lien" routerLink="/dashboard/factures" routerLinkActive="sidebar-lien-actif">
              <i class="bi bi-receipt me-2" aria-hidden="true"></i>Mes factures
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link sidebar-lien" routerLink="/dashboard/profil" routerLinkActive="sidebar-lien-actif">
              <i class="bi bi-person-fill me-2" aria-hidden="true"></i>Mon profil
            </a>
          </li>
        }
      </ul>

      <!-- Pied de la sidebar : profil et déconnexion -->
      <div class="sidebar-pied">
        <div class="sidebar-profil">
          <span class="sidebar-avatar" aria-hidden="true"><i class="bi bi-person-fill"></i></span>
          <div class="sidebar-identite">
            <strong>{{ roleAffiche }}</strong>
            <small>{{ emailClient }}</small>
          </div>
        </div>
        <button type="button" class="btn-contour sidebar-deconnexion" (click)="deconnexion()">
          <i class="bi bi-box-arrow-right" aria-hidden="true"></i>Déconnexion
        </button>
      </div>
    </nav>

    <!-- Contenu principal (pages enfants) -->
    <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-5 dashboard-contenu">
      <router-outlet />
    </main>
  </div>
</div>
