@if (aDesDonnees()) {
  <div class="gr-aire">
    <svg class="gr-aire-svg"
         viewBox="0 0 320 210"
         preserveAspectRatio="xMidYMid meet"
         role="img"
         [attr.aria-label]="description()">
      <title>{{ titre() }}</title>
      @if (description()) {
        <desc>{{ description() }}</desc>
      }

      <defs>
        <linearGradient [attr.id]="idDegrade" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" [style.stop-color]="couleur()" stop-opacity="0.38" />
          <stop offset="100%" [style.stop-color]="couleur()" stop-opacity="0" />
        </linearGradient>
      </defs>

      <!-- Grille horizontale -->
      @for (graduation of axeY(); track graduation.y) {
        <line class="gr-aire-grille"
              [attr.x1]="margeGauche"
              [attr.x2]="largeurTotale - margeDroite"
              [attr.y1]="graduation.y"
              [attr.y2]="graduation.y" />
        <text class="gr-aire-graduation"
              [attr.x]="margeGauche - 5"
              [attr.y]="graduation.y + 3"
              text-anchor="end">{{ graduation.libelle }}</text>
      }

      <!-- Aire et courbe -->
      <path class="gr-aire-remplissage" [attr.d]="aire()" [attr.fill]="'url(#' + idDegrade + ')'" />
      <path class="gr-aire-courbe" [attr.d]="courbe()" [attr.stroke]="couleur()" />

      <!-- Dernier point mis en avant -->
      @if (dernierPoint(); as point) {
        <circle class="gr-aire-point"
                [attr.cx]="point.x"
                [attr.cy]="point.y"
                r="4"
                [attr.stroke]="couleur()" />
      }

      <!-- Axe horizontal -->
      @for (etiquette of axeX(); track etiquette.x) {
        @if (etiquette.visible) {
          <text class="gr-aire-categorie"
                [attr.x]="etiquette.x"
                [attr.y]="etiquette.y"
                text-anchor="middle">{{ etiquette.libelle }}</text>
        }
      }
    </svg>

    @if (dernier(); as dernier) {
      <p class="gr-aire-pied">
        <span class="gr-aire-pied-libelle">{{ dernier.libelle }}</span>
        <strong class="gr-aire-pied-valeur">{{ dernier.valeur }}</strong>
      </p>
    }
  </div>
} @else {
  <div class="gr-vide">
    <i class="bi bi-graph-up" aria-hidden="true"></i>
    <span>{{ messageVide() }}</span>
  </div>
}
