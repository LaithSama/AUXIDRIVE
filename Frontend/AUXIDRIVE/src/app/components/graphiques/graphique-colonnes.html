@if (aDesDonnees()) {
  <svg class="gr-colonnes-svg"
       viewBox="0 0 320 210"
       preserveAspectRatio="xMidYMid meet"
       role="img"
       [attr.aria-label]="description()">
    <title>{{ titre() }}</title>
    @if (description()) {
      <desc>{{ description() }}</desc>
    }

    <!-- Grille horizontale -->
    @for (graduation of axeY(); track graduation.y) {
      <line class="gr-colonnes-grille"
            [attr.x1]="margeGauche"
            [attr.x2]="largeurTotale - margeDroite"
            [attr.y1]="graduation.y"
            [attr.y2]="graduation.y" />
      <text class="gr-colonnes-graduation"
            [attr.x]="margeGauche - 5"
            [attr.y]="graduation.y + 3"
            text-anchor="end">{{ graduation.libelle }}</text>
    }

    <!-- Colonnes -->
    @for (groupe of groupes(); track $index) {
      @for (colonne of groupe; track $index) {
        <rect class="gr-colonnes-barre"
              [attr.x]="colonne.x"
              [attr.y]="colonne.y"
              [attr.width]="colonne.largeur"
              [attr.height]="colonne.hauteur"
              [attr.fill]="colonne.couleur"
              rx="2" />
        @if (colonne.hauteur > 0) {
          <text class="gr-colonnes-valeur"
                [attr.x]="colonne.x + colonne.largeur / 2"
                [attr.y]="colonne.y - 4"
                text-anchor="middle">{{ colonne.valeur }}</text>
        }
      }
    }

    <!-- Axe horizontal -->
    @for (etiquette of axeX(); track etiquette.x) {
      <text class="gr-colonnes-categorie"
            [attr.x]="etiquette.x"
            [attr.y]="etiquette.y"
            text-anchor="middle">{{ etiquette.libelle }}</text>
    }
  </svg>
} @else {
  <div class="gr-vide">
    <i class="bi bi-bar-chart-steps" aria-hidden="true"></i>
    <span>{{ messageVide() }}</span>
  </div>
}
